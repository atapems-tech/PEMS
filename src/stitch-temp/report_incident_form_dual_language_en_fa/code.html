<style>
        /* Custom overrides to match PEMS enterprise utility styling */
        body {
            background-color: #f3f5f8;
        }
        .persian-text {
            font-family: 'Vazirmatn', sans-serif; /* Fallback for Persian */
            direction: rtl;
        }
        
        /* Custom Form Input Styles matching guidelines */
        .form-input-pems {
            border-radius: 0.5rem; /* xl from config */
            border: 1px solid #c5c6cd; /* outline-variant */
            background-color: #ffffff; /* surface-container-lowest */
            color: #081d2f; /* on-surface */
            font-family: 'Inter';
            font-size: 13.5px;
            font-weight: 400;
            padding: 12px 16px;
            width: 100%;
            transition: all 0.2s ease;
        }
        .form-input-pems:focus {
            outline: none;
            border-color: #fdaa47; /* secondary-container - industrial amber */
            box-shadow: 0 0 0 2px rgba(253, 170, 71, 0.2);
        }

        .severity-radio:checked + label {
            border-color: currentColor;
            background-color: currentColor;
        }
        
        /* Specific colors for severity levels */
        .sev-low:checked + label { background-color: #d7e3fd; color: #101c2f; border-color: #d7e3fd; } /* primary-fixed */
        .sev-med:checked + label { background-color: #ffdcbc; color: #683d00; border-color: #ffdcbc; } /* secondary-fixed */
        .sev-high:checked + label { background-color: #fdaa47; color: #000819; border-color: #fdaa47; } /* secondary-container */
        .sev-crit:checked + label { background-color: #ffdad6; color: #93000a; border-color: #ffdad6; } /* error-container */

    </style>
</head>
<body class="bg-surface text-on-surface font-body-base h-screen flex flex-col md:max-w-2xl md:mx-auto md:shadow-xl relative pb-[80px]">
<!-- TopAppBar Structure -->
<header class="w-full top-0 sticky z-10 bg-surface border-b border-outline-variant flat no shadows">
<div class="flex items-center justify-between px-md h-topbar-height w-full">
<button class="text-primary hover:bg-surface-container-high transition-colors p-2 rounded-full active:opacity-80">
<span class="material-symbols-outlined font-headline-md text-headline-md" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="text-primary font-bold font-headline-lg-mobile text-headline-lg-mobile">Report Incident</h1>
<span class="font-badge-label text-badge-label text-on-surface-variant persian-text mt-0.5">ثبت حادثه</span>
</div>
<div class="bg-surface-container-high text-primary px-3 py-1 rounded-full border border-outline-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[14px]">engineering</span>
<span class="font-badge-label text-badge-label uppercase">PMP-102</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto p-md pb-xl space-y-lg relative">
<!-- Step Indicator -->
<div class="flex items-center justify-between px-4 py-2 bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant mb-6">
<div class="flex flex-col items-center flex-1">
<div class="w-8 h-8 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center font-bold font-body-medium text-body-medium mb-1">1</div>
<span class="font-badge-label text-badge-label text-on-surface">Basic Info</span>
<span class="font-badge-label text-badge-label text-on-surface-variant persian-text text-[10px]">اطلاعات اولیه</span>
</div>
<div class="h-[2px] w-8 bg-secondary-container"></div>
<div class="flex flex-col items-center flex-1 opacity-50">
<div class="w-8 h-8 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center font-bold font-body-medium text-body-medium border border-outline-variant mb-1">2</div>
<span class="font-badge-label text-badge-label text-on-surface">Evidence</span>
</div>
<div class="h-[2px] w-8 bg-surface-container-high"></div>
<div class="flex flex-col items-center flex-1 opacity-50">
<div class="w-8 h-8 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center font-bold font-body-medium text-body-medium border border-outline-variant mb-1">3</div>
<span class="font-badge-label text-badge-label text-on-surface">Review</span>
</div>
</div>
<!-- Form Section 1: Basic Details -->
<section class="bg-surface-container-lowest p-md rounded-xl shadow-sm border border-outline-variant space-y-md">
<!-- Incident Type -->
<div class="space-y-sm">
<div class="flex justify-between items-end">
<label class="font-body-medium text-body-medium text-on-surface">Incident Type <span class="text-error">*</span></label>
<label class="font-body-medium text-body-medium text-on-surface-variant persian-text">نوع حادثه</label>
</div>
<div class="relative">
<select class="form-input-pems appearance-none pr-10 cursor-pointer py-3 h-[48px]">
<option disabled="" selected="" value="">Select Incident Type...</option>
<option value="mech">Mechanical Failure</option>
<option value="safety">Safety Violation</option>
<option value="leak">Leakage</option>
<option value="fire">Fire/Smoke</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 text-on-surface-variant pointer-events-none">arrow_drop_down</span>
</div>
</div>
<!-- Severity Level (Segmented Control) -->
<div class="space-y-sm pt-2">
<div class="flex justify-between items-end mb-2">
<label class="font-body-medium text-body-medium text-on-surface">Severity Level <span class="text-error">*</span></label>
<label class="font-body-medium text-body-medium text-on-surface-variant persian-text">سطح شدت</label>
</div>
<div class="grid grid-cols-4 gap-2">
<div class="relative">
<input class="sr-only severity-radio sev-low" id="sev-low" name="severity" type="radio"/>
<label class="flex flex-col items-center justify-center p-2 rounded-lg border border-outline-variant cursor-pointer hover:bg-surface-container transition-colors h-[64px]" for="sev-low">
<span class="font-label-caps text-label-caps uppercase">Low</span>
<span class="persian-text text-[11px] mt-1 font-semibold">سبز</span>
</label>
</div>
<div class="relative">
<input checked="" class="sr-only severity-radio sev-med" id="sev-med" name="severity" type="radio"/>
<label class="flex flex-col items-center justify-center p-2 rounded-lg border border-outline-variant cursor-pointer hover:bg-surface-container transition-colors h-[64px]" for="sev-med">
<span class="font-label-caps text-label-caps uppercase">Medium</span>
<span class="persian-text text-[11px] mt-1 font-semibold">زرد</span>
</label>
</div>
<div class="relative">
<input class="sr-only severity-radio sev-high" id="sev-high" name="severity" type="radio"/>
<label class="flex flex-col items-center justify-center p-2 rounded-lg border border-outline-variant cursor-pointer hover:bg-surface-container transition-colors h-[64px]" for="sev-high">
<span class="font-label-caps text-label-caps uppercase">High</span>
<span class="persian-text text-[11px] mt-1 font-semibold">نارنجی</span>
</label>
</div>
<div class="relative">
<input class="sr-only severity-radio sev-crit" id="sev-crit" name="severity" type="radio"/>
<label class="flex flex-col items-center justify-center p-2 rounded-lg border border-outline-variant cursor-pointer hover:bg-error-container transition-colors h-[64px]" for="sev-crit">
<span class="font-label-caps text-label-caps uppercase">Critical</span>
<span class="persian-text text-[11px] mt-1 font-semibold">قرمز</span>
</label>
</div>
</div>
</div>
<!-- Timestamp & Location Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md pt-2">
<div class="space-y-sm">
<div class="flex justify-between items-end">
<label class="font-body-medium text-body-medium text-on-surface">Time of Incident</label>
<label class="font-body-medium text-body-medium text-on-surface-variant persian-text text-sm">زمان حادثه</label>
</div>
<div class="relative">
<input class="form-input-pems pl-10 py-3 h-[48px]" type="datetime-local" value="2023-10-27T14:30"/>
<span class="material-symbols-outlined absolute left-3 top-3 text-on-surface-variant pointer-events-none">schedule</span>
</div>
</div>
<div class="space-y-sm">
<div class="flex justify-between items-end">
<label class="font-body-medium text-body-medium text-on-surface">Exact Location</label>
<label class="font-body-medium text-body-medium text-on-surface-variant persian-text text-sm">مکان دقیق</label>
</div>
<div class="relative flex">
<input class="form-input-pems pl-10 py-3 h-[48px] rounded-r-none border-r-0" placeholder="e.g. Pump Station 4" type="text"/>
<span class="material-symbols-outlined absolute left-3 top-3 text-on-surface-variant pointer-events-none">location_on</span>
<button class="bg-surface-container-high border border-outline-variant border-l-0 rounded-r-xl px-3 flex items-center justify-center text-primary hover:bg-surface-container-highest transition-colors active:opacity-80" type="button">
<span class="material-symbols-outlined">map</span>
</button>
</div>
</div>
</div>
</section>
<!-- Form Section 2: Details & Media -->
<section class="bg-surface-container-lowest p-md rounded-xl shadow-sm border border-outline-variant space-y-md">
<!-- Description -->
<div class="space-y-sm">
<div class="flex justify-between items-end">
<label class="font-body-medium text-body-medium text-on-surface">Description / Details</label>
<label class="font-body-medium text-body-medium text-on-surface-variant persian-text">شرح / جزئیات</label>
</div>
<textarea class="form-input-pems min-h-[120px] resize-y" placeholder="Describe the incident in detail. Include any immediate actions taken."></textarea>
</div>
<div class="w-full h-px bg-outline-variant my-4"></div>
<!-- Multimedia Upload -->
<div class="space-y-sm">
<div class="flex justify-between items-end mb-2">
<label class="font-body-medium text-body-medium text-on-surface">Evidence Collection</label>
<label class="font-body-medium text-body-medium text-on-surface-variant persian-text">جمع‌آوری شواهد</label>
</div>
<div class="grid grid-cols-2 gap-sm">
<button class="flex flex-col items-center justify-center gap-2 p-4 border-2 border-dashed border-outline-variant rounded-xl hover:border-secondary-container hover:bg-surface-container-low transition-colors h-[100px]" type="button">
<span class="material-symbols-outlined text-on-surface-variant text-[32px]">add_a_photo</span>
<span class="font-badge-label text-badge-label text-on-surface">Add Photos/Video</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-4 border-2 border-dashed border-outline-variant rounded-xl hover:border-error hover:bg-error-container/20 transition-colors h-[100px]" type="button">
<span class="material-symbols-outlined text-on-surface-variant text-[32px]">mic</span>
<span class="font-badge-label text-badge-label text-on-surface">Record Voice Memo</span>
</button>
</div>
</div>
</section>
<!-- Bottom spacing for fixed bottom nav if it existed, or just general padding -->
<div class="h-10"></div>
</main>
<!-- Fixed Footer Action -->
<div class="fixed bottom-0 w-full md:max-w-2xl bg-surface-container-lowest border-t border-outline-variant p-md shadow-[0_-4px_10px_rgba(0,0,0,0.05)] z-20">
<button class="w-full h-[56px] rounded-xl flex items-center justify-between px-6 bg-gradient-to-r from-[#d98c2b] to-[#b8721e] text-on-secondary shadow-md active:scale-[0.98] transition-transform" type="submit">
<span class="font-headline-md text-headline-md">Submit Incident</span>
<div class="flex items-center gap-4">
<span class="persian-text font-bold text-[18px]">ثبت حادثه</span>
<span class="material-symbols-outlined">send</span>
</div>
</button>
</div>
<!-- Hidden BottomNavBar Structure (Suppressed due to form intent, as per rules, but included in DOM for complete reference if needed by framework, commented out logically) -->
<!-- Navigation shell suppressed because page intent is Linear/Transactional (Reporting Form). -->
</body></html>
