<body class="bg-background text-on-surface antialiased min-h-screen flex items-center justify-center font-body-base">
<!-- Blurred Background Backdrop -->
<div class="fixed inset-0 bg-primary/20 backdrop-blur-md z-40"></div>
<!-- Modal Container -->
<div class="relative z-50 w-full max-w-3xl bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(20,32,51,0.08)] flex flex-col max-h-[921px] mx-4 border border-outline-variant/30">
<!-- Modal Header -->
<div class="flex items-start justify-between px-lg py-md border-b border-outline-variant/30 bg-surface-bright rounded-t-xl">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Edit Employee</h2>
<p class="font-body-base text-body-base text-on-surface-variant mt-xs">Marcus Thorne • Senior Plant Engineer</p>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-sm rounded-full hover:bg-surface-variant/50">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Body (Scrollable) -->
<div class="flex-1 overflow-y-auto p-lg space-y-lg">
<!-- Core Info Section -->
<section>
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-md border-b border-outline-variant/30 pb-xs">Core Information</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div>
<label class="block font-body-medium text-body-medium text-on-surface mb-xs">Full Name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-base text-body-base focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all" type="text" value="Marcus Thorne"/>
</div>
<div>
<label class="block font-body-medium text-body-medium text-on-surface mb-xs">Employee ID</label>
<input class="w-full bg-surface-container-low border border-outline-variant/50 text-on-surface-variant rounded-lg px-md py-sm font-table-cell text-table-cell outline-none cursor-not-allowed" disabled="" type="text" value="EMP-8492"/>
</div>
<div>
<label class="block font-body-medium text-body-medium text-on-surface mb-xs">Email Address</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-base text-body-base focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all" type="email" value="m.thorne@pems.enterprises"/>
</div>
<div>
<label class="block font-body-medium text-body-medium text-on-surface mb-xs">Hire Date</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-base text-body-base focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all" type="date" value="2018-04-12"/>
</div>
<div>
<label class="block font-body-medium text-body-medium text-on-surface mb-xs">Department</label>
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-base text-body-base focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all appearance-none">
<option>Engineering</option>
<option>Operations</option>
<option>Maintenance</option>
<option>Safety</option>
</select>
</div>
<div>
<label class="block font-body-medium text-body-medium text-on-surface mb-xs">Status</label>
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-base text-body-base focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all appearance-none">
<option selected="">Active</option>
<option>On Leave</option>
<option>Suspended</option>
<option>Terminated</option>
</select>
</div>
<div class="md:col-span-2">
<label class="block font-body-medium text-body-medium text-on-surface mb-xs">Role</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-base text-body-base focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all" type="text" value="Senior Plant Engineer"/>
</div>
<div class="md:col-span-2">
<label class="block font-body-medium text-body-medium text-on-surface mb-xs">Home Address</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-base text-body-base focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all" rows="2">442 Industrial Parkway, Suite 100, Sector 4</textarea>
</div>
</div>
</section>
<!-- Contact Section -->
<section>
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-md border-b border-outline-variant/30 pb-xs">Contact Details</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div>
<label class="block font-body-medium text-body-medium text-on-surface mb-xs">Phone Number</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-base text-body-base focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all" type="tel" value="+1 (555) 019-8234"/>
</div>
<div>
<label class="block font-body-medium text-body-medium text-on-surface mb-xs">Emergency Contact</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-base text-body-base focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all" type="text" value="Sarah Thorne - +1 (555) 019-8235"/>
</div>
</div>
</section>
<!-- Health & Safety Section -->
<section>
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-md border-b border-outline-variant/30 pb-xs">Health &amp; Safety</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div>
<label class="block font-body-medium text-body-medium text-on-surface mb-xs">Blood Type</label>
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-base text-body-base focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all appearance-none">
<option>O+</option>
<option>O-</option>
<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
</select>
</div>
<div>
<label class="block font-body-medium text-body-medium text-on-surface mb-xs">Allergies</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-base text-body-base focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all" type="text" value="Penicillin, Latex"/>
</div>
<div class="md:col-span-2">
<label class="block font-body-medium text-body-medium text-on-surface mb-xs">Medical Conditions</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-base text-body-base focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all" rows="2">Mild Asthma (Inhaler kept on person)</textarea>
</div>
</div>
</section>
</div>
<!-- Modal Footer Actions -->
<div class="flex items-center justify-end px-lg py-md border-t border-outline-variant/30 bg-surface-bright rounded-b-xl space-x-md">

                Cancel
            </button>
<button class="px-lg py-sm rounded-lg bg-gradient-to-r from-[#d98c2b] to-[#b8721e] text-on-primary font-body-medium text-body-medium shadow-sm hover:opacity-90 transition-opacity">
                Save Changes
            </button>
