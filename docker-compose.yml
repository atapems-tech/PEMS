# ==========================================================================
# PEMS - Docker Compose (محیط توسعه/On-Premise)
# سه سرویس: pems-web (خود برنامه)، sqlserver (دیتابیس)، ollama (موتور AI محلی).
# طبق سند: "AI باید On-Premise/Offline بماند" - هیچ داده‌ای به بیرون سازمان نمی‌رود.
# ==========================================================================

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pems-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-Pems@2026StrongPass}"
    ports:
      - "1433:1433"
    volumes:
      - pems-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: pems-ollama
    ports:
      - "11434:11434"
    volumes:
      - pems-ollama-data:/root/.ollama
    # اولین بار بعد از بالا آمدن، مدل را دستی Pull کنید:
    #   docker exec -it pems-ollama ollama pull qwen2.5:3b

  pems-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pems-web
    depends_on:
      sqlserver:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__PEMSConnection: "Server=sqlserver;Database=PEMSDB;User Id=sa;Password=${SQL_SA_PASSWORD:-Pems@2026StrongPass};TrustServerCertificate=True"
      Ollama__Url: "http://ollama:11434"
      Ollama__Model: "${OLLAMA_MODEL:-qwen2.5:3b}"
    volumes:
      - pems-uploads:/app/wwwroot/uploads
      - pems-logs:/app/logs

volumes:
  pems-sql-data:
  pems-ollama-data:
  pems-uploads:
  pems-logs:
