# ==========================================================================
# PEMS - Docker Compose (محیط توسعه/On-Premise)
# سه سرویس: pems-web (خود برنامه)، sqlserver (دیتابیس)، ollama (موتور AI محلی).
# طبق سند: "AI باید On-Premise/Offline بماند" - هیچ داده‌ای به بیرون سازمان نمی‌رود.
# ==========================================================================

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pems-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?SQL_SA_PASSWORD is not set - put it in env/docker.secrets.env and run: docker compose --env-file env/docker.secrets.env up}"
    # Published on the loopback interface only: the database must never be reachable from the network (SCRUM-17).
    # pems-web reaches it over the compose network (sqlserver:1433). To allow an admin tool from another host, tunnel instead of widening this.
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - pems-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: pems-ollama
    # Loopback only: the Ollama API has no authentication (SCRUM-17). pems-web uses http://ollama:11434 over the compose network.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - pems-ollama-data:/root/.ollama
    # اولین بار بعد از بالا آمدن، مدل را دستی Pull کنید:
    #   docker exec -it pems-ollama ollama pull qwen2.5:3b

  pems-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pems-web
    depends_on:
      sqlserver:
        condition: service_healthy
      ollama:
        condition: service_started
    # Loopback only, like the deploy kit (deploy/docker/compose.pems-web.yml): publish through a TLS reverse proxy, not plain HTTP (SCRUM-17).
    ports:
      - "127.0.0.1:8080:8080"
    # Settings: env/docker.env; secrets: env/docker.secrets.env (copy env/docker.secrets.env.example). Nothing is hard-coded here.
    env_file:
      - env/docker.env
      - env/docker.secrets.env
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      PEMS_ENV: "docker"
    volumes:
      - pems-uploads:/app/wwwroot/uploads
      - pems-logs:/app/logs

volumes:
  pems-sql-data:
  pems-ollama-data:
  pems-uploads:
  pems-logs:
