# Deploys the demo subdomain on every push or merge to the `demo` branch (and on manual run).
# The build, tests, publish and upload are in deploy-site.yml. Secrets: DEMO_* (docs/deployment/DEPLOYMENT_README.md).

name: PEMS Demo Deploy

on:
  push:
    branches: [demo]
    paths-ignore: ['docs/**', 'plan/**', 'legacy-trash/**', '*.md']      # documentation-only pushes do not redeploy
  workflow_dispatch:
    inputs:
      force_tests:
        description: 'Run the test gate even if this exact source tree already passed it'
        type: boolean
        default: false
      rollback_ref:
        description: 'Roll back: commit, tag or branch of the previous good build to deploy instead of the branch head'
        type: string
        default: ''
      allow_unstaged:
        description: 'Deploy even if this source tree was not deployed to staging first (rollback of a never-staged build)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-site.yml
    with:
      target: demo
      prefix: DEMO
      force_gate: ${{ github.event.inputs.force_tests == 'true' }}
      ref: ${{ github.event.inputs.rollback_ref }}
      require_staged: true
      allow_unstaged: ${{ github.event.inputs.allow_unstaged == 'true' }}
    secrets: inherit
