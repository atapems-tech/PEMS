# طبق PEMS Architecture & Development Bible (Volume X - DevOps): CI پایه.
# فقط Build و Restore را بررسی می‌کند - افزودن Test واقعی وقتی PEMS.Tests محتوا داشته باشد.

name: PEMS Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore
        run: dotnet restore PEMS.slnx

      - name: Build
        run: dotnet build PEMS.slnx --no-restore --configuration Release

      - name: Test (when PEMS.Tests has real tests)
        run: dotnet test PEMS.slnx --no-build --configuration Release --verbosity normal
        continue-on-error: true
