# طبق PEMS Architecture & Development Bible (Volume X - DevOps): CI پایه.
# فقط Build و Restore را بررسی می‌کند - افزودن Test واقعی وقتی PEMS.Tests محتوا داشته باشد.

name: PEMS Build (manual)

on:
  workflow_dispatch:   # manual only: no pipeline runs on pushes or pull requests to main or any working branch (docs/guidelines/00, DEPLOYMENT_README.md)

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The plan is markdown (plan/rows, plan/sheets): consistency check and the tool's own tests, standard library only.
      - name: Plan check
        run: |
          python tools/plan-sync/plan_sync.py check
          python -m unittest discover -s tools/plan-sync

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore
        run: dotnet restore PEMS.slnx

      - name: Build
        run: dotnet build PEMS.slnx --no-restore --configuration Release

      # Code-first gate: the entity model and the migrations must agree, otherwise the
      # startup migrator (Database:MigrateOnStartup) cannot apply a complete schema.
      - name: Model drift gate (no entity change without a migration)
        env:
          # model-only comparison: the design-time factory needs a connection string but no connection is opened
          ConnectionStrings__PEMSConnection: Server=localhost;Database=PEMS_ModelCheck;Trusted_Connection=True;TrustServerCertificate=True
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.10
          dotnet ef migrations has-pending-model-changes --project PEMS.Migrations --startup-project PEMS.Web --no-build --configuration Release

      - name: Test (when PEMS.Tests has real tests)
        run: dotnet test PEMS.slnx --no-build --configuration Release --verbosity normal
        continue-on-error: true
